workflows:
  ios-unsigned-ipa:
    name: AbogaRed iOS (.ipa sin costo macOS M2)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Instalar XcodeGen y generar proyecto Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Compilar AbogaRed para iPhone (sin firma / Sideloadly)
        script: |
          xcodebuild build \
            -project AbogaRed.xcodeproj \
            -scheme AbogaRed \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
          mkdir -p build/ipa/Payload build/out
          cp -R build/DerivedData/Build/Products/Release-iphoneos/AbogaRed.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../out/AbogaRed-unsigned.ipa Payload)
    artifacts:
      - build/out/*.ipa
