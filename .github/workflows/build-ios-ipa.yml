name: Compilar AbogaRed iOS (.ipa) Gratis

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publicar archivo .ipa en GitHub Releases"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      upload_testflight:
        description: "Subir automáticamente a TestFlight / App Store Connect (si existen secrets ASC)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  build-ios:
    name: Generar AbogaRed.ipa (macOS)
    runs-on: macos-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar XcodeGen y generar AbogaRed.xcodeproj
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Mostrar versión de Xcode y SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphone

      - name: Detectar configuración de firma Apple (App Store / Ad-Hoc)
        id: signing
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -n "$CERT_B64" ] && [ -n "$CERT_PASS" ] && [ -n "$PROFILE_B64" ] && [ -n "$TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_B64" ]; then
            echo "has_asc=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_asc=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar AbogaRed-unsigned.ipa (Modo sin firma / Sideloadly)
        if: steps.signing.outputs.signed == 'false'
        run: |
          xcodebuild build \
            -project AbogaRed.xcodeproj \
            -scheme AbogaRed \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/AbogaRed.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: No se encontró $APP_PATH"
            exit 1
          fi

          rm -rf build/ipa build/out
          mkdir -p build/ipa/Payload build/out
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry ../out/AbogaRed-unsigned.ipa Payload)
          ls -lh build/out/AbogaRed-unsigned.ipa

      - name: Compilar AbogaRed-signed.ipa (Firmado oficial Apple Distribution)
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.APPLE_EXPORT_METHOD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="abogared-ci-keychain"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 --decode > "$CERT_PATH"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Apple Distribution|iPhone Distribution|Apple Development/{print $2; exit}')
          if [ -z "$SIGNING_IDENTITY" ]; then
            SIGNING_IDENTITY="Apple Distribution"
          fi
          echo "Usando identidad de firma: $SIGNING_IDENTITY"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          export PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          python3 - <<'PY'
          import plistlib, os
          opts = {
              "method": (os.environ.get("EXPORT_METHOD") or "app-store-connect").strip(),
              "teamID": os.environ["APPLE_TEAM_ID"].strip(),
              "signingStyle": "manual",
              "uploadSymbols": True,
              "manageAppVersionAndBuildNumber": False,
              "provisioningProfiles": {
                  "com.abogared.app": os.environ["PROFILE_NAME"].strip(),
              },
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as f:
              plistlib.dump(opts, f)
          PY

          xcodebuild archive \
            -project AbogaRed.xcodeproj \
            -scheme AbogaRed \
            -configuration Release \
            -archivePath build/AbogaRed.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

          mkdir -p build/out
          xcodebuild -exportArchive \
            -archivePath build/AbogaRed.xcarchive \
            -exportPath build/out \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          if [ -f "build/out/AbogaRed.ipa" ]; then
            mv build/out/AbogaRed.ipa build/out/AbogaRed-signed.ipa
          fi
          ls -lh build/out/*.ipa

      - name: Subir a TestFlight / App Store Connect
        if: steps.signing.outputs.signed == 'true' && steps.signing.outputs.has_asc == 'true' && github.event.inputs.upload_testflight != 'false'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8_B64" | tr -d '[:space:]' | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          IPA_FILE=$(ls build/out/*-signed.ipa build/out/*.ipa 2>/dev/null | head -n 1)
          echo "Subiendo $IPA_FILE a App Store Connect / TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Subir artefacto .ipa descargable
        uses: actions/upload-artifact@v4
        with:
          name: AbogaRed-iOS-IPA
          path: build/out/*.ipa
          retention-days: 90

      - name: Publicar .ipa en GitHub Releases (opcional)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.2.{0}', github.run_number) }}
          name: AbogaRed iOS ${{ format('v1.2.{0}', github.run_number) }}
          files: build/out/*.ipa
          generate_release_notes: true
